name: zernyar

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DEBUG: 1
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_ENVIRONMENT_TYPE', 'local' );
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', false );
    define( 'FS_METHOD', 'direct' );
    if ( getenv( 'UACK_TELEGRAM_TOKEN' ) ) {
      define( 'UACK_TELEGRAM_TOKEN', getenv( 'UACK_TELEGRAM_TOKEN' ) );
      define( 'UACK_TELEGRAM_CHAT_ID', getenv( 'UACK_TELEGRAM_CHAT_ID' ) );
    }
  UACK_TELEGRAM_TOKEN: ${UACK_TELEGRAM_TOKEN:-}
  UACK_TELEGRAM_CHAT_ID: ${UACK_TELEGRAM_CHAT_ID:-}

x-wp-volumes: &wp-volumes
  - wp:/var/www/html
  - ./plugins/ua-commerce-kit:/var/www/html/wp-content/plugins/ua-commerce-kit
  - ./plugins/zernyar-demo:/var/www/html/wp-content/plugins/zernyar-demo
  - ./themes/zernyar:/var/www/html/wp-content/themes/zernyar
  - ./docker/mu-plugins:/var/www/html/wp-content/mu-plugins

services:
  db:
    image: mariadb:10.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MARIADB_ROOT_PASSWORD\" --silent"]
      interval: 3s
      timeout: 5s
      retries: 40

  wordpress:
    image: wordpress:7.1.3-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WP_PORT:-8090}:80"
    environment: *wp-env
    volumes: *wp-volumes

  cli:
    image: wordpress:cli-2.12-php8.3
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wp-env
      HOME: /tmp
    volumes:
      - wp:/var/www/html
      - ./plugins/ua-commerce-kit:/var/www/html/wp-content/plugins/ua-commerce-kit
      - ./plugins/zernyar-demo:/var/www/html/wp-content/plugins/zernyar-demo
      - ./themes/zernyar:/var/www/html/wp-content/themes/zernyar
      - ./docker/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./scripts:/scripts:ro

  tools:
    build: docker/tools
    profiles: ["tools"]
    working_dir: /app
    environment:
      COMPOSER_CACHE_DIR: /app/.cache/composer
    volumes:
      - .:/app

volumes:
  db:
  wp:
